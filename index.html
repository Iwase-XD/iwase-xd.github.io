
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0a0808">

<title>iwase // links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #d32f2f;
    --light-red: #ff4545;
    --dark-red: #650000;
    --background: #090909;
    --panel: rgba(15, 15, 15, 0.82);
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    font-family: 'Inter', sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(120, 0, 0, 0.15),
            transparent 55%
        ),
        linear-gradient(
            -45deg,
            #080808,
            #200606,
            #101010,
            #350000,
            #080808
        );

    background-size: 100% 100%, 400% 400%;
    animation: backgroundMove 16s ease infinite;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;

    overflow-x: hidden;
}

@keyframes backgroundMove {
    0% { background-position: center, 0% 50%; }
    50% { background-position: center, 100% 50%; }
    100% { background-position: center, 0% 50%; }
}

/* =========================
   AMBIENT LIGHT
========================= */

body::before {
    content: "";

    position: fixed;
    width: 350px;
    height: 350px;

    background: rgba(180, 0, 0, 0.12);
    filter: blur(120px);

    border-radius: 50%;

    top: -150px;
    left: -120px;

    pointer-events: none;
}

body::after {
    content: "";

    position: fixed;
    width: 300px;
    height: 300px;

    background: rgba(130, 0, 0, 0.10);
    filter: blur(120px);

    border-radius: 50%;

    bottom: -150px;
    right: -100px;

    pointer-events: none;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 460px;

    text-align: center;

    animation: fadeUp 0.8s ease both;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   PROFILE
========================= */

.profile {
    margin-bottom: 30px;
}

.avatar-wrapper {
    display: inline-block;
    position: relative;

    margin-bottom: 18px;
}

.avatar {
    display: block;

    width: 115px;
    height: 115px;

    border-radius: 50%;
    object-fit: cover;

    border: 2px solid rgba(255, 60, 60, 0.8);

    box-shadow:
        0 0 15px rgba(200, 0, 0, 0.35),
        0 0 40px rgba(200, 0, 0, 0.15);

    transition: 0.4s ease;
}

.avatar:hover {
    transform: scale(1.05);

    box-shadow:
        0 0 25px rgba(255, 0, 0, 0.5),
        0 0 60px rgba(200, 0, 0, 0.2);
}

h1 {
    font-size: clamp(42px, 12vw, 64px);
    font-weight: 900;

    letter-spacing: -3px;
    text-transform: lowercase;

    text-shadow:
        0 0 20px rgba(255, 0, 0, 0.35);
}

.profile-description {
    color: #777;

    font-size: 12px;
    font-weight: 500;

    letter-spacing: 3px;
    text-transform: uppercase;

    margin-top: 7px;
}

/* =========================
   CONTENT PANEL
========================= */

.button-container {
    width: 100%;

    background: var(--panel);

    padding: 30px;

    border: 1px solid rgba(180, 0, 0, 0.3);
    border-radius: 20px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        inset 0 0 30px rgba(255, 0, 0, 0.025);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

/* =========================
   SECTION HEADINGS
========================= */

.section-title {
    display: flex;
    align-items: center;
    gap: 12px;

    color: #ed4545;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 4px;
    text-transform: uppercase;

    text-align: left;

    margin: 25px 0 15px;
}

.section-title:first-child {
    margin-top: 0;
}

.section-title::after {
    content: "";

    flex: 1;
    height: 1px;

    background: linear-gradient(
        to right,
        rgba(200, 0, 0, 0.5),
        transparent
    );
}

/* =========================
   BUTTONS
========================= */

.button {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;

    width: 100%;

    min-height: 58px;

    padding: 16px 20px;
    margin: 12px 0;

    background: linear-gradient(
        110deg,
        rgba(100, 0, 0, 0.22),
        rgba(25, 25, 25, 0.8)
    );

    border: 1px solid #512020;
    border-radius: 12px;

    color: #eee;
    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 0.4px;

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.button::after {
    content: "↗";

    color: #a33;
    font-size: 19px;

    transition: 0.3s ease;
}

.button:hover {
    background: linear-gradient(
        110deg,
        rgba(160, 0, 0, 0.4),
        rgba(40, 10, 10, 0.9)
    );

    border-color: #d33;

    transform: translateY(-3px);

    box-shadow:
        0 8px 25px rgba(150, 0, 0, 0.2);
}

.button:hover::after {
    color: #ff5555;
    transform: translate(3px, -3px);
}

.button:active {
    transform: scale(0.98);
}

.button:focus-visible {
    outline: 2px solid #ff5555;
    outline-offset: 4px;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 25px;

    color: #555;

    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* =========================
   TABLET
========================= */

@media (max-width: 768px) {

    body {
        padding: 35px 24px;
    }

    .container {
        max-width: 430px;
    }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {
        align-items: flex-start;

        padding:
            max(35px, env(safe-area-inset-top))
            18px
            max(35px, env(safe-area-inset-bottom));
    }

    .container {
        max-width: 100%;
    }

    .profile {
        margin-bottom: 25px;
    }

    .avatar {
        width: 100px;
        height: 100px;
    }

    h1 {
        font-size: 52px;
    }

    .button-container {
        padding: 24px 18px;
        border-radius: 17px;
    }

    .section-title {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .button {
        min-height: 56px;
        padding: 16px;

        font-size: 14px;
        border-radius: 11px;

        margin: 10px 0;
    }

    .footer {
        margin-top: 22px;
    }

}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 350px) {

    body {
        padding-left: 12px;
        padding-right: 12px;
    }

    .button-container {
        padding: 20px 13px;
    }

    h1 {
        font-size: 45px;
    }

    .avatar {
        width: 85px;
        height: 85px;
    }

}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }

}

</style>
</head>

</body>
</html>
