<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CODM BR GUNSMITHS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101010;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 20%, #292929 0%, transparent 55%),
        linear-gradient(135deg, #111 0%, #080808 100%);
    z-index: -1;
}

/* HEADER */

.header {
    text-align: center;
    padding: 65px 20px 40px;
}

.header .tag {
    color: #f5e900;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

.header h1 {
    font-size: clamp(35px, 7vw, 70px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.header h1 span {
    color: #f5e900;
}

.header p {
    color: #777;
    font-size: 13px;
    letter-spacing: 3px;
    margin-top: 12px;
}

/* DIVIDER */

.divider {
    width: 80px;
    height: 4px;
    background: #f5e900;
    margin: 25px auto;
}

/* SECTION */

.section-title {
    text-align: center;
    color: #888;
    font-size: 12px;
    letter-spacing: 4px;
    margin: 15px 0 25px;
}

/* BUTTON CONTAINER */

.container {
    width: 90%;
    max-width: 650px;
    margin: auto;
    padding-bottom: 60px;
}

/* WEAPON BUTTONS */

.button {
    display: flex;
    align-items: center;
    justify-content: space-between;

    width: 100%;
    padding: 20px 25px;
    margin: 12px 0;

    background: #1c1c1c;
    border: 1px solid #333;
    border-left: 5px solid #f5e900;

    color: white;
    text-decoration: none;
    text-transform: uppercase;

    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;

    transition: 0.25s ease;
    position: relative;
    overflow: hidden;
}

/* HOVER EFFECT */

.button:hover {
    background: #f5e900;
    color: #111;
    border-color: #f5e900;
    transform: translateX(6px);
    box-shadow: 0 0 20px #f5e90030;
}

.button .arrow {
    color: #f5e900;
    font-size: 23px;
    transition: 0.25s;
}

.button:hover .arrow {
    color: #111;
    transform: translateX(5px);
}

/* FOOTER */

.footer {
    text-align: center;
    padding: 25px;
    border-top: 1px solid #252525;
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
}

/* MOBILE */

@media (max-width: 600px) {
    .header {
        padding-top: 50px;
    }

    .button {
        padding: 18px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="tag">CALL OF DUTY MOBILE</div>

    <h1>BR <span>GUNSMITHS</span></h1>

    <p>MGA BUILD NA PANG GAGO BY IWASE</p>

    <div class="divider"></div>
</header>

<div class="section-title">
    SELECT WEAPON CATEGORY
</div>

<main class="container">

    <a href="ar.html" class="button">
        <span>Assault Rifles</span>
        <span class="arrow">›</span>
    </a>

    <a href="smg.html" class="button">
        <span>Sub-Machine Guns *</span>
        <span class="arrow">›</span>
    </a>

    <a href="lmg.html" class="button">
        <span>Light-Machine Guns *</span>
        <span class="arrow">›</span>
    </a>

    <a href="sr.html" class="button">
        <span>Sniper Rifles *</span>
        <span class="arrow">›</span>
    </a>

    <a href="sg.html" class="button">
        <span>Shotgun *</span>
        <span class="arrow">›</span>
    </a>

    <a href="mr.html" class="button">
        <span>Marksman Rifles *</span>
        <span class="arrow">›</span>
    </a>

</main>

<footer class="footer">
    "CLICK BEFORE YOU THINK"
</footer>

</body>
</html>
